<div class="page">
  <div class="card">
    <a routerLink="/" class="back-link">← Back</a>
    <h2>Create a game</h2>
    <div class="field">
      <label for="tvcode">TV code</label>
      <input id="tvcode" type="text" [(ngModel)]="tvCode"
        placeholder="Code shown on TV"
        maxlength="7"
        class="code-input"
        (input)="tvCode" />
      <p class="help-text">Enter the code shown on your TV screen.</p>
    </div>
    <div class="field">
      <label for="name">Your display name</label>
      <input id="name" type="text" [(ngModel)]="displayName" placeholder="e.g. DJ Soprano" maxlength="50" />
    </div>
    <button class="btn btn-primary" [disabled]="!canCreate" (click)="create()">
      {{ loading() ? 'Creating…' : 'Create game' }}
    </button>
    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }
  </div>
</div>
