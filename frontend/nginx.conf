 server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # TV app SPA (served under /tv/, base-href /tv/)
    location = /tv {
        return 301 /tv/;
    }
    location /tv/ {
        try_files $uri $uri/ /tv/index.html;
    }

    # Phone app SPA (served at /)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Video streaming proxy (disable buffering so byte ranges stream immediately)
    location ~ ^/api/videos/[^/]+/stream$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # REST API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket / STOMP proxy
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}